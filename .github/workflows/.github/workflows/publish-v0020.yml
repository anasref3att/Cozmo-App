name: Publish verified Cozmo v0.0.20 ZIP (no build)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cozmo-v0020
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify draft, join tested ZIP and publish
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft == true and .name == "Cozmo v0.0.20 - Intel native app") | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          work="$RUNNER_TEMP/cozmo-release"
          mkdir -p "$work"
          cd "$work"
          gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | "\(.id) \(.name)"' | tee assets.txt
          [ "$(wc -l < assets.txt)" = 2 ]
          id1=$(awk '$2 ~ /Cozmo-Native-Intel[.]zip[.]part1$/{print $1}' assets.txt)
          id2=$(awk '$2 ~ /Cozmo-Native-Intel[.]zip[.]part2$/{print $1}' assets.txt)
          [[ "$id1" =~ ^[0-9]+$ && "$id2" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id1" > Cozmo-Native-Intel.zip.part1
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id2" > Cozmo-Native-Intel.zip.part2
          printf '%s  %s\n' 2459fdc6b8a90c8d61c8e8b11b27c46636876f71a8e5490ad020dec268539269 Cozmo-Native-Intel.zip.part1 3f0832624786d478fdb288a3859a88aa1d5492c5a8e9ef40c0f3ef6a4e0657a5 Cozmo-Native-Intel.zip.part2 | sha256sum --check -
          cat Cozmo-Native-Intel.zip.part1 Cozmo-Native-Intel.zip.part2 > Cozmo-Native-Intel.zip
          printf '%s  %s\n' dc1e531e7f6bdcc51db2aec7a126d9a93c4fac8ae399a66afaaf706f067b22fb Cozmo-Native-Intel.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq Cozmo-Native-Intel.zip
          up="https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets"
          gh api --method POST "$up?name=Cozmo-Native-Intel.zip" -H "Content-Type: application/zip" --input Cozmo-Native-Intel.zip --jq .name
          gh api --method POST "$up?name=SHA256SUMS" -H "Content-Type: text/plain" --input SHA256SUMS --jq .name
          gh api --method DELETE "repos/$GH_REPO/releases/assets/$id1"
          gh api --method DELETE "repos/$GH_REPO/releases/assets/$id2"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f tag_name=v0.0.20 -F draft=false -F prerelease=false -f make_latest=true --jq '.html_url'
          gh api "repos/$GH_REPO/releases/tags/v0.0.20" --jq '{url:.html_url,prerelease,draft,assets:[.assets[]|{name,size,digest}]}'
