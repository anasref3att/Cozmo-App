name: Publish verified Cozmo v0.0.23 native ZIPs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cozmo-v0023
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Join audited assets, verify and publish both native builds
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft == true and .name == "Cozmo v0.0.23 - Mission Desk") | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/cozmo-release"
          cd "$RUNNER_TEMP/cozmo-release"
          gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | "\(.id) \(.name)"' | tee assets.txt
          [ "$(wc -l < assets.txt)" = 4 ]
          id1=$(awk '$2 == "Cozmo-Native-Intel.zip.part1" {print $1}' assets.txt)
          id2=$(awk '$2 == "Cozmo-Native-Intel.zip.part2" {print $1}' assets.txt)
          [[ "$id1" =~ ^[0-9]+$ && "$id2" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id1" > Cozmo-Native-Intel.zip.part1
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id2" > Cozmo-Native-Intel.zip.part2
          printf '%s  %s\n' ac502f403899635568b8abc2e31932cb74fb050e348a94acf7abd3709dd940c4 Cozmo-Native-Intel.zip.part1 242003b2406a6571e7020bd99165a982f9ad15fa678e0aec9c111b52ba4259b8 Cozmo-Native-Intel.zip.part2 | sha256sum --check -
          cat Cozmo-Native-Intel.zip.part1 Cozmo-Native-Intel.zip.part2 > Cozmo-Native-Intel.zip
          printf '%s  %s\n' fd694238ecb26bc14fc2f89d54d0ff236b1df53c36d9a8d311d8ee4f8fd44006 Cozmo-Native-Intel.zip >> SHA256SUMS
          unzip -tq Cozmo-Native-Intel.zip
          id1=$(awk '$2 == "Cozmo-Native-AppleSilicon.zip.part1" {print $1}' assets.txt)
          id2=$(awk '$2 == "Cozmo-Native-AppleSilicon.zip.part2" {print $1}' assets.txt)
          [[ "$id1" =~ ^[0-9]+$ && "$id2" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id1" > Cozmo-Native-AppleSilicon.zip.part1
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id2" > Cozmo-Native-AppleSilicon.zip.part2
          printf '%s  %s\n' 01ccc71df42de0770cfb9deb11b7c04c453ca77cb349e7fd20453cfe9181cc0c Cozmo-Native-AppleSilicon.zip.part1 1d19d631984d3c03ba96e481a4d0ca8432b2d419d6194f55c65c9ae8af886677 Cozmo-Native-AppleSilicon.zip.part2 | sha256sum --check -
          cat Cozmo-Native-AppleSilicon.zip.part1 Cozmo-Native-AppleSilicon.zip.part2 > Cozmo-Native-AppleSilicon.zip
          printf '%s  %s\n' 9210f62dd7173f78274bc08e5efc4d040db37c3dad487327f4362902340577a5 Cozmo-Native-AppleSilicon.zip >> SHA256SUMS
          unzip -tq Cozmo-Native-AppleSilicon.zip
          sha256sum --check SHA256SUMS
          up="https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets"
          for name in Cozmo-Native-Intel.zip Cozmo-Native-AppleSilicon.zip; do
            gh api --method POST "$up?name=$name" -H "Content-Type: application/zip" --input "$name" --jq .name
          done
          gh api --method POST "$up?name=SHA256SUMS" -H "Content-Type: text/plain" --input SHA256SUMS --jq .name
          while read -r id name; do
            [[ "$id" =~ ^[0-9]+$ && "$name" == *.zip.part[12] ]]
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$id"
          done < assets.txt
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f tag_name=v0.0.23 -F draft=false -F prerelease=false -f make_latest=true --jq '.html_url'
          gh api "repos/$GH_REPO/releases/tags/v0.0.23" --jq '{url:.html_url,prerelease,draft,assets:[.assets[]|{name,size,digest}]}'
