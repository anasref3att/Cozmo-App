name: Publish audited Cozmo v0.0.36 Route Builder
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-cozmo-v0036
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify audited native ZIPs and publish
        shell: bash
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft == true and .name == "Cozmo v0.0.36 - Route Builder") | .id')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/draft-release"
          cd "$RUNNER_TEMP/draft-release"
          gh api "repos/$GH_REPO/releases/$release_id/assets" --jq '.[] | "\(.id) \(.name)"' | tee assets.txt
          [ "$(wc -l < assets.txt)" = 6 ]
          id=$(awk '$2 == "Cozmo-Native-AppleSilicon.zip.part1" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-AppleSilicon.zip.part1
          printf '%s  %s\n' 8cdffd744e51ad9672cb5f83a55e4d5e6e6a1f26e043139e26b10ad165db5273 Cozmo-Native-AppleSilicon.zip.part1 | sha256sum --check -
          id=$(awk '$2 == "Cozmo-Native-AppleSilicon.zip.part2" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-AppleSilicon.zip.part2
          printf '%s  %s\n' 2018a1159622fceada29ae34c693f868f1e267cfb091255c54c3fa984131d4d1 Cozmo-Native-AppleSilicon.zip.part2 | sha256sum --check -
          id=$(awk '$2 == "Cozmo-Native-AppleSilicon.zip.part3" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-AppleSilicon.zip.part3
          printf '%s  %s\n' 62db1794eadf23ff32032eebaabcd1543b5d6484b02ec12e40a91658f3c78209 Cozmo-Native-AppleSilicon.zip.part3 | sha256sum --check -
          cat Cozmo-Native-AppleSilicon.zip.part1 Cozmo-Native-AppleSilicon.zip.part2 Cozmo-Native-AppleSilicon.zip.part3 > Cozmo-Native-AppleSilicon.zip
          printf '%s  %s\n' 6d826a576ba068426e71307cc4a66071ce82846417ca8ffff71879e3df623a50 Cozmo-Native-AppleSilicon.zip >> SHA256SUMS
          unzip -tq Cozmo-Native-AppleSilicon.zip
          id=$(awk '$2 == "Cozmo-Native-Intel.zip.part1" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-Intel.zip.part1
          printf '%s  %s\n' f38d2a68d859687ce77498665be562be4e629694dc6cc8d661d6412bee68d837 Cozmo-Native-Intel.zip.part1 | sha256sum --check -
          id=$(awk '$2 == "Cozmo-Native-Intel.zip.part2" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-Intel.zip.part2
          printf '%s  %s\n' 5330cecc9fefc73203b32557504532f8b53db2f023d36f88d0b14f371889d1b6 Cozmo-Native-Intel.zip.part2 | sha256sum --check -
          id=$(awk '$2 == "Cozmo-Native-Intel.zip.part3" {print $1}' assets.txt)
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > Cozmo-Native-Intel.zip.part3
          printf '%s  %s\n' 9d1d8840347de02b59cf5ea2a1c24e3a178db0fd41c68cedbe901cd11349ac30 Cozmo-Native-Intel.zip.part3 | sha256sum --check -
          cat Cozmo-Native-Intel.zip.part1 Cozmo-Native-Intel.zip.part2 Cozmo-Native-Intel.zip.part3 > Cozmo-Native-Intel.zip
          printf '%s  %s\n' a65d885b285fd153996b312bf4586bcc757ea708b4f5cbf017c7db9c5c38fa11 Cozmo-Native-Intel.zip >> SHA256SUMS
          unzip -tq Cozmo-Native-Intel.zip
          sha256sum --check SHA256SUMS
          up="https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets"
          for name in Cozmo-Native-Intel.zip Cozmo-Native-AppleSilicon.zip; do
            gh api --method POST "$up?name=$name" -H "Content-Type: application/zip" --input "$name" --jq .name
          done
          gh api --method POST "$up?name=SHA256SUMS" -H "Content-Type: text/plain" --input SHA256SUMS --jq .name
          while read -r id name; do
            [[ "$id" =~ ^[0-9]+$ && "$name" == *.zip.part[123] ]]
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$id"
          done < assets.txt
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -f tag_name=v0.0.36 -F draft=false -F prerelease=false -f make_latest=true --jq '.html_url'
          gh api "repos/$GH_REPO/releases/tags/v0.0.36" --jq '{url:.html_url,prerelease,draft,assets:[.assets[]|{name,size,digest}]}'
